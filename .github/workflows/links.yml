name: Links experiment
on:
  workflow_dispatch:
  push:
    branches: ['feature/netsurf']
    paths: ['scripts/45-links.sh', '.github/workflows/links.yml']
jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo ./prereqs.sh && sudo apt-get install -y libgpm-dev
      - name: Build only the links stage
        run: ci/run.sh sudo -E env WORK="$PWD/build" OUT="$PWD/out" ./build.sh links
      - name: Tail of the log
        if: always()
        run: echo "::error title=logtail::$(tail -n 14 build/logs/links.log | cut -c1-200 | sed 's/%/%25/g' | tr '\n' '|')"
      - name: Why no graphics driver
        if: always()
        run: |
          cd build/src/links-b
          echo "::error title=help::$(./configure --help | grep -i -A1 'fb\|gpm\|graphics\|svgalib\|sdl' | cut -c1-120 | tr '\n' '|')"
          echo "::error title=cfg2::$(sed -n 1610,1650p config.log | cut -c1-170 | sed 's/%/%25/g' | tr '\n' '|')"
          echo "::error title=cfglog::$(grep -n -i 'fb\|framebuf' config.log | head -20 | cut -c1-160 | sed 's/%/%25/g' | tr '\n' '|')"
      - name: Report
        run: |
          B=build/pkg/links/usr; ls -la $B/bin $B/lib | head -40
          echo "::notice title=drv::$(build/pkg/links/usr/bin/links -help 2>&1 | head -5 | tr '\n' '|'); drivers: $(strings $B/bin/links | grep -i -m5 'framebuffer\|fbdev' | tr '\n' '|')"
          echo "::notice title=libs::$(ls $B/lib | tr '\n' ' ')"
