name: NetSurf experiment
on:
  workflow_dispatch:
  push:
    branches: ['feature/netsurf']
    paths: ['scripts/45-netsurf.sh', '.github/workflows/netsurf.yml']
jobs:
  netsurf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo ./prereqs.sh
      - name: Build only the netsurf stage
        run: ci/run.sh sudo -E env WORK="$PWD/build" OUT="$PWD/out" ./build.sh netsurf
      - name: Show netsurf-fb usage and libraries
        run: |
          B=build/pkg/netsurf/usr; ls -la $B/bin $B/lib | head -40
          out=$(LD_LIBRARY_PATH=$B/lib $B/bin/netsurf-fb -h 2>&1 | head -30 | tr '\n' '|'); echo "::notice title=usage::$out"
          echo "::notice title=size::$(du -sh build/pkg/netsurf | cut -f1) libs: $(ls $B/lib | tr '\n' ' ')"
          echo "::notice title=res::$(find build/pkg/netsurf -type d | head -20 | tr '\n' ' ')"
      - name: libnsfb surfaces
        run: |
          L=build/src/netsurf-all/libnsfb
          echo "::notice title=surf::$(ls $L/src/surface | tr '\n' ' ')"
          echo "::notice title=mk::$(grep -n -i 'linux\|AVAILABLE\|NSFB_' $L/Makefile | head -40 | tr '\n' '|')"
          echo "::notice title=cfg::$(cat $L/Makefile.config 2>/dev/null | head; ls $L)"
