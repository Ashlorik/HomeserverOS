name: Build HomeserverOS
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bison flex libssl-dev libncurses-dev libuuid-dev e2fsprogs dosfstools mtools xorriso busybox wget genext2fs

      - name: Run Build Script
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-image
          path: out/homeserver-tui.img
