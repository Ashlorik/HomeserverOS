name: Build HomeserverOS
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04  # Фиксируем стабильную версию Ubuntu, чтобы избежать проблем с обновлениями GitHub
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          # Устанавливаем зависимости по отдельности, чтобы избежать общих критических сбоев apt
          sudo apt-get install -y build-essential bison flex libssl-dev libncurses-dev libuuid-dev e2fsprogs dosfstools mtools xorriso busybox wget
          sudo apt-get install -y grub-common || true
          
      - name: Run Build Script
        run: |
          chmod +x build.sh
          # Запускаем сборку с правами суперпользователя
          sudo ./build.sh
          
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-image
          path: out/homeserver-tui.img
