name: Lang experiment
on:
  workflow_dispatch:
  push:
    branches: ['feature/lang']
    paths: ['scripts/65-lang.sh', '.github/workflows/lang.yml']
jobs:
  lang:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y kbd console-setup-linux
      - name: Fonts and keymaps available
        run: |
          echo "::notice title=fonts::$(ls /usr/share/consolefonts | head -60 | tr '\n' ' ')"
          echo "::notice title=maps::$(find /usr/share/keymaps /usr/share/kbd/keymaps -name '*ru*' 2>/dev/null | head -20 | tr '\n' ' ')"
      - name: Build only the lang stage
        run: ci/run.sh sudo -E env WORK="$PWD/build" OUT="$PWD/out" ./build.sh lang
      - run: |
          echo "::notice title=out::$(find build/pkg/lang -type f -exec ls -la {} \; | awk '{print $5, $9}' | tr '\n' '|')"
