# HomeServer OS multiboot menu for Redmi Note 7 (lavender)
# Search roots: /data/HSBOOT, /sdcard/HSBOOT, /mnt/sdcard/HSBOOT, /mnt/usb/HSBOOT
timeout=8
default=evox
gui=1

entry evox   "Evolution X (stock boot)"  type=android  boot=/data/HSBOOT/backup/boot.img
entry hsos   "HomeServer OS (ARM64)"     type=linux    kernel=hsos/Image dtb=hsos/lavender.dtb initrd=hsos/initrd.img cmdline="console=tty0 hs.gui=1"
entry pmos   "postmarketOS"              type=linux    kernel=pmos/Image dtb=pmos/lavender.dtb initrd=pmos/initramfs cmdline="pmos_root=/dev/loop0"
entry debian "Debian ARM64"              type=linux    kernel=debian/Image dtb=debian/lavender.dtb initrd=debian/initrd.img cmdline="root=/dev/loop0"
entry myos   "MyOS"                      type=raw      image=myos/myos.bin
entry recov  "OrangeFox recovery"        type=android  boot=/data/HSBOOT/backup/recovery.img
