# HomeServer OS — dnsmasq default configuration
# Edit via: hs-dns configure   or   hs-menu → Network → DNS/DHCP server
interface=eth0
bind-interfaces
domain=home.lan
local=/home.lan/
expand-hosts
dhcp-range=192.168.1.100,192.168.1.200,12h
dhcp-option=6,1.1.1.1,8.8.8.8
dhcp-authoritative
cache-size=400
no-resolv
server=1.1.1.1
server=8.8.8.8
